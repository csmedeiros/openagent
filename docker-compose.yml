services:

  openagent:
    build:
      context: .
      dockerfile: Dockerfile
    image: openagent:latest
    container_name: openagent
    ports:
      - "8080:8080"
      - "3000:3000"
      - "8000:8000"
    env_file:
      - .env
    environment:
      - WORKSPACE_ROOT=C:\openagent-workspace
      - UPLOAD_DIR=C:\openagent-workspace\uploads
      - API_PORT=8080
      - WEB_PORT=3000
    volumes:
      # Mount a host folder as the agent's workspace so files persist
      - ${HOST_WORKSPACE:-C:\openagent-workspace}:C:\openagent-workspace
    restart: unless-stopped
